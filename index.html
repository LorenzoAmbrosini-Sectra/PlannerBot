<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlannerBot</title>
<script src="msal.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #004071; --navy1: #00548e; --blue2: #0a93cd;
    --blue3: #61a9d6; --blue4: #97c9ec; --blue5: #aad3f1;
    --web: #005fa2; --grey: #939598; --orange: #f58025;
    --bg: #f4f5f6; --white: #ffffff;
    --border: rgba(0,64,113,0.12); --border2: rgba(0,64,113,0.2);
    --text: #1a2a3a; --text2: #4a6070; --text3: #939598;
    --user-bubble: #e8f2fa; --surface2: #eef3f8;
  }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

  /* ── AUTH ── */
  #auth-screen {
    flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem;
    background: linear-gradient(160deg, #004071 0%, #00548e 50%, #0a93cd 100%);
  }
  .auth-card { background: var(--white); border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 400px; box-shadow: 0 8px 40px rgba(0,64,113,0.25); display: flex; flex-direction: column; gap: 1.25rem; }
  .auth-logo { display: flex; align-items: center; gap: 12px; }
  .auth-logo-icon { width: 40px; height: 40px; background: var(--navy); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .auth-logo-icon svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; }
  .auth-logo-text { font-size: 22px; font-weight: 700; color: var(--navy); }
  .auth-tagline { font-size: 13px; color: var(--text2); line-height: 1.6; }
  .auth-divider { height: 1px; background: var(--border); }
  .field-label { font-size: 11px; font-weight: 700; color: var(--navy1); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 6px; }
  .field-input { width: 100%; padding: 10px 12px; background: var(--bg); border: 1.5px solid var(--border2); border-radius: 8px; font-size: 13px; color: var(--text); font-family: inherit; transition: border-color .15s; }
  .field-input:focus { outline: none; border-color: var(--web); background: var(--white); }
  .field-input::placeholder { color: var(--text3); }
  .field-hint { font-size: 12px; color: var(--text3); margin-top: 5px; line-height: 1.5; }
  .field-hint a { color: var(--web); text-decoration: none; }
  .btn-primary { width: 100%; padding: 12px; background: var(--navy); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; transition: background .15s; }
  .btn-primary:hover { background: var(--navy1); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .auth-error { font-size: 13px; color: #a0320a; background: rgba(245,128,37,0.1); border: 1px solid rgba(245,128,37,0.3); border-radius: 7px; padding: 9px 12px; display: none; }

  /* ── APP ── */
  #app { flex: 1; display: none; flex-direction: column; overflow: hidden; }

  .header { height: 52px; background: var(--navy); display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem; flex-shrink: 0; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-icon { width: 28px; height: 28px; background: rgba(255,255,255,0.15); border-radius: 7px; display: flex; align-items: center; justify-content: center; }
  .header-icon svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; }
  .header-title { font-size: 15px; font-weight: 700; color: #fff; }
  .header-plan { font-size: 12px; color: var(--blue4); padding: 3px 10px; background: rgba(255,255,255,0.1); border-radius: 20px; cursor: pointer; transition: background .12s; }
  .header-plan:hover { background: rgba(255,255,255,0.2); }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .header-user { font-size: 12px; color: var(--blue4); }
  .btn-ghost { padding: 5px 11px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; font-size: 12px; color: #fff; cursor: pointer; font-family: inherit; transition: background .12s; }
  .btn-ghost:hover { background: rgba(255,255,255,0.2); }

  /* ── SPLIT LAYOUT ── */
  .split { flex: 1; display: flex; overflow: hidden; }

  /* ── CHAT PANEL ── */
  .chat-panel { width: 480px; min-width: 360px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--white); }
  .chat-messages { flex: 1; overflow-y: auto; padding: 1.25rem 1rem; display: flex; flex-direction: column; gap: 1rem; background: var(--bg); }
  .chat-messages::-webkit-scrollbar { width: 3px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--blue4); border-radius: 2px; }

  .msg { display: flex; gap: 8px; }
  .msg.user { flex-direction: row-reverse; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; margin-top: 2px; }
  .avatar.bot { background: var(--navy); color: #fff; }
  .avatar.user { background: var(--blue3); color: #fff; }
  .bubble { padding: 9px 13px; border-radius: 12px; font-size: 13px; line-height: 1.65; max-width: calc(100% - 40px); word-break: break-word; overflow-wrap: anywhere; }
  .msg.bot .bubble { background: var(--white); border: 1px solid var(--border); border-top-left-radius: 3px; box-shadow: 0 1px 3px rgba(0,64,113,0.06); }
  .msg.user .bubble { background: var(--user-bubble); border: 1px solid rgba(0,95,162,0.2); border-top-right-radius: 3px; }
  .bubble strong { color: var(--navy); font-weight: 600; }
  .bubble em { color: var(--text2); font-style: italic; }
  .bubble code { background: var(--surface2); border-radius: 4px; padding: 1px 6px; font-size: 12px; font-family: monospace; }

  /* Plan picker chips in chat */
  .plan-chips { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .plan-chip { padding: 8px 12px; background: var(--surface2); border: 1.5px solid var(--border2); border-radius: 8px; cursor: pointer; transition: all .12s; display: flex; justify-content: space-between; align-items: center; }
  .plan-chip:hover { border-color: var(--web); background: var(--user-bubble); }
  .plan-chip-name { font-size: 13px; font-weight: 600; color: var(--navy); }
  .plan-chip-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .plan-chip-arrow { color: var(--blue3); font-size: 16px; }

  .typing { display: flex; gap: 4px; align-items: center; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--blue3); animation: bounce .9s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

  .suggestions { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 10px; border-top: 1px solid var(--border); background: var(--white); flex-shrink: 0; }
  .sug { padding: 5px 11px; background: var(--bg); border: 1px solid var(--border2); border-radius: 20px; font-size: 12px; color: var(--navy1); cursor: pointer; font-family: inherit; transition: all .12s; white-space: nowrap; font-weight: 500; }
  .sug:hover { background: var(--user-bubble); border-color: var(--web); }

  .input-area { padding: 10px; border-top: 1px solid var(--border); background: var(--white); flex-shrink: 0; }
  .input-wrap { display: flex; gap: 6px; align-items: flex-end; background: var(--bg); border: 1.5px solid var(--border2); border-radius: 12px; padding: 7px 7px 7px 12px; transition: border-color .15s; }
  .input-wrap:focus-within { border-color: var(--web); background: var(--white); }
  #chat-input { flex: 1; background: transparent; border: none; outline: none; font-size: 13px; color: var(--text); font-family: inherit; resize: none; max-height: 100px; line-height: 1.5; min-height: 20px; }
  #chat-input::placeholder { color: var(--text3); }
  .send-btn { width: 32px; height: 32px; border-radius: 8px; background: var(--navy); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: background .12s; }
  .send-btn:hover { background: var(--navy1); }
  .send-btn:disabled { opacity: .4; cursor: not-allowed; }
  .send-btn svg { width: 14px; height: 14px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  /* ── TASK PANEL ── */
  .task-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--white); }
  .task-panel-header { padding: 0 1.25rem; height: 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--surface2); }
  .task-panel-title { font-size: 14px; font-weight: 600; color: var(--navy); }
  .task-panel-count { font-size: 12px; color: var(--text3); }
  .task-filters { display: flex; gap: 5px; padding: 8px 1rem; border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; background: var(--white); }
  .filter-btn { padding: 4px 11px; border-radius: 20px; font-size: 12px; border: 1px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; font-family: inherit; transition: all .12s; font-weight: 500; }
  .filter-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .filter-btn:hover:not(.active) { background: var(--user-bubble); border-color: var(--web); color: var(--navy); }

  .task-list { flex: 1; overflow-x: auto; overflow-y: hidden; padding: 1rem; display: flex; flex-direction: row; gap: 12px; align-items: flex-start; }
  .task-list::-webkit-scrollbar { height: 4px; }
  .task-list::-webkit-scrollbar-thumb { background: var(--blue4); border-radius: 2px; }

  /* Kanban columns */
  .bucket-col { min-width: 220px; width: 220px; flex-shrink: 0; display: flex; flex-direction: column; gap: 0; background: var(--bg); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .bucket-col-header { padding: 10px 12px 8px; display: flex; align-items: center; justify-content: space-between; background: var(--surface2); border-bottom: 1px solid var(--border); }
  .bucket-col-name { font-size: 12px; font-weight: 700; color: var(--navy); }
  .bucket-col-count { font-size: 11px; color: var(--text3); background: var(--white); border-radius: 10px; padding: 1px 7px; }
  .bucket-col-tasks { padding: 8px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; max-height: calc(100vh - 200px); }
  .bucket-col-tasks::-webkit-scrollbar { width: 3px; }
  .bucket-col-tasks::-webkit-scrollbar-thumb { background: var(--blue4); border-radius: 2px; }

  .task-item { background: var(--white); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; display: flex; align-items: flex-start; gap: 8px; transition: border-color .12s; cursor: default; }
  .task-item:hover { border-color: var(--border2); }
  .task-check { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--text3); flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .15s; }
  .task-check:hover { border-color: var(--web); }
  .task-check.done { background: var(--web); border-color: var(--web); }
  .task-check.done::after { content: ''; width: 6px; height: 4px; border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff; transform: rotate(-45deg) translate(1px,-1px); display: block; }
  .task-info { flex: 1; min-width: 0; }
  .task-title { font-size: 12px; font-weight: 500; color: var(--text); line-height: 1.4; word-break: break-word; }
  .task-title.done { text-decoration: line-through; opacity: .5; }
  .task-tags { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; align-items: center; }
  .task-tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--surface2); color: var(--text3); }
  .task-tag.urgent { background: rgba(245,128,37,0.1); color: #a0320a; }
  .task-tag.important { background: rgba(0,84,142,0.08); color: var(--navy1); }
  .task-tag.overdue { background: rgba(245,128,37,0.12); color: #a0320a; font-weight: 600; }

  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 13px; }
  .no-plan-state { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 8px; color: var(--text3); font-size: 13px; padding: 2rem; text-align: center; }
  .no-plan-state strong { color: var(--navy); font-size: 15px; }

  @media (max-width: 700px) {
    .chat-panel { width: 100%; border-right: none; }
    .task-panel { display: none; }
  }
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon"><svg viewBox="0 0 22 22"><path d="M3 5h16M3 11h10M3 17h13"/></svg></div>
      <span class="auth-logo-text">PlannerBot</span>
    </div>
    <div class="auth-tagline">Manage your Microsoft Planner tasks through natural conversation, powered by AI.</div>
    <div class="auth-divider"></div>
    <div>
      <div class="field-label">Azure OpenAI Key</div>
      <input type="password" class="field-input" id="az-key-input" placeholder="Paste your Azure OpenAI key…" autocomplete="off" />
      <div class="field-hint">Ask your team admin for the key. Stored only in your browser session.</div>
    </div>
    <button class="btn-primary" id="signin-btn" onclick="signIn()">
      <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
        <rect x="1" y="1" width="7.5" height="7.5" fill="white" fill-opacity="0.9"/>
        <rect x="9.5" y="1" width="7.5" height="7.5" fill="white" fill-opacity="0.65"/>
        <rect x="1" y="9.5" width="7.5" height="7.5" fill="white" fill-opacity="0.65"/>
        <rect x="9.5" y="9.5" width="7.5" height="7.5" fill="white" fill-opacity="0.9"/>
      </svg>
      Sign in with Microsoft
    </button>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div class="header-left">
      <div class="header-icon"><svg viewBox="0 0 17 17"><path d="M2 4h13M2 8.5h9M2 13h11"/></svg></div>
      <span class="header-title">PlannerBot</span>
      <span class="header-plan" id="header-plan" onclick="switchPlan()" title="Click to switch plan"></span>
    </div>
    <div class="header-right">
      <span class="header-user" id="header-user"></span>
      <button class="btn-ghost" onclick="signOut()">Sign out</button>
    </div>
  </div>

  <div class="split">
    <!-- CHAT -->
    <div class="chat-panel">
      <div id="plan-bar" style="display:none;padding:8px 12px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="font-size:12px;color:var(--text3);">Working on</span>
          <span id="plan-bar-name" style="font-size:13px;font-weight:600;color:var(--navy);"></span>
        </div>
        <button onclick="switchPlan()" style="padding:4px 11px;background:var(--navy);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;flex-shrink:0;">Switch plan</button>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="suggestions" id="suggestions" style="display:none">
        <button class="sug" onclick="useSug(this)">Show all tasks</button>
        <button class="sug" onclick="useSug(this)">What's overdue?</button>
        <button class="sug" onclick="useSug(this)">Show urgent tasks</button>
        <button class="sug" onclick="useSug(this)">Create a task</button>
        <button class="sug" onclick="useSug(this)">Switch plan</button>
      </div>
      <div class="input-area">
        <div class="input-wrap">
          <textarea id="chat-input" placeholder="Ask about your tasks…" rows="1"
            onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
          <button class="send-btn" id="send-btn" onclick="sendMsg()">
            <svg viewBox="0 0 14 14"><path d="M13 7H1M8 2l5 5-5 5"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- TASKS -->
    <div class="task-panel">
      <div class="task-panel-header">
        <span class="task-panel-title" id="task-panel-title">Tasks</span>
        <span class="task-panel-count" id="task-panel-count"></span>
      </div>
      <div class="task-filters" id="task-filters" style="display:none">
        <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
        <button class="filter-btn" onclick="setFilter('active',this)">Active</button>
        <button class="filter-btn" onclick="setFilter('overdue',this)">Overdue</button>
        <button class="filter-btn" onclick="setFilter('completed',this)">Completed</button>
      </div>
      <div class="task-list" id="task-list">
        <div class="no-plan-state">
          <strong>No plan selected</strong>
          Ask PlannerBot which plan you'd like to work on.
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const CLIENT_ID  = '5ef81d14-7831-4351-8bdd-1ce20332c76a';
const AUTHORITY  = 'https://login.microsoftonline.com/9ef776ce-851e-48c1-9cb2-f5d8498c8b15';
const REDIRECT   = 'https://lorenzoambrosini-sectra.github.io/PlannerBot';
const SCOPES     = ['Tasks.ReadWrite', 'Group.Read.All', 'User.Read', 'Files.Read.All', 'Sites.Read.All'];
const GRAPH      = 'https://graph.microsoft.com/v1.0';
const AZ_URL     = 'https://openai-poc-infra.openai.azure.com/openai/deployments/gpt-4o/chat/completions?api-version=2024-02-01';

let msalApp, accessToken, AZ_KEY;
let plans = [], currentPlan = null, history = [], busy = false;
let currentFilter = 'all';

// ── MSAL ──
function initMsal() {
  if (typeof Msal === 'undefined') { setTimeout(initMsal, 100); return; }
  msalApp = new Msal.UserAgentApplication({
    auth: { clientId: CLIENT_ID, authority: AUTHORITY, redirectUri: REDIRECT },
    cache: { cacheLocation: 'sessionStorage', storeAuthStateInCookie: true }
  });
  msalApp.handleRedirectCallback((err, resp) => {
    if (err) { showAuthError(err.errorMessage || err.message); return; }
    if (resp && resp.accessToken) { accessToken = resp.accessToken; AZ_KEY = sessionStorage.getItem('pb_azkey'); initApp(); }
  });
  msalApp.acquireTokenSilent({ scopes: SCOPES, authority: AUTHORITY, redirectUri: REDIRECT })
    .then(r => { accessToken = r.accessToken; AZ_KEY = sessionStorage.getItem('pb_azkey'); if (AZ_KEY) initApp(); })
    .catch(() => {});
}
window.addEventListener('DOMContentLoaded', initMsal);

function signIn() {
  const key = document.getElementById('az-key-input').value.trim();
  if (!key) { showAuthError('Please enter your Azure OpenAI key.'); return; }
  sessionStorage.setItem('pb_azkey', key);
  const btn = document.getElementById('signin-btn');
  btn.disabled = true; btn.textContent = 'Redirecting…';
  msalApp.loginRedirect({ scopes: SCOPES, authority: AUTHORITY });
}
function signOut() { sessionStorage.clear(); msalApp.logout(); }
function showAuthError(msg) {
  const el = document.getElementById('auth-error'); el.style.display = 'block'; el.textContent = msg;
  const btn = document.getElementById('signin-btn'); btn.disabled = false;
  btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="7.5" height="7.5" fill="white" fill-opacity="0.9"/><rect x="9.5" y="1" width="7.5" height="7.5" fill="white" fill-opacity="0.65"/><rect x="1" y="9.5" width="7.5" height="7.5" fill="white" fill-opacity="0.65"/><rect x="9.5" y="9.5" width="7.5" height="7.5" fill="white" fill-opacity="0.9"/></svg> Sign in with Microsoft`;
}

async function initApp() {
  try {
    const me = await callGraph('/me');
    document.getElementById('header-user').textContent = me.displayName || me.mail;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    await loadPlans();
    askWhichPlan();
  } catch(e) { showAuthError('Failed to load: ' + e.message); }
}

async function loadPlans() {
  const data = await callGraph('/me/planner/plans');
  plans = data.value || [];
  await Promise.all(plans.map(async p => {
    try {
      const td = await callGraph(`/planner/plans/${p.id}/tasks`);
      p._tasks = td.value || [];
      p._activeTasks = p._tasks.filter(t => t.percentComplete !== 100).length;
    } catch(e) { p._tasks = []; p._activeTasks = 0; }
  }));
}

function askWhichPlan() {
  let usage = {};
  try { usage = JSON.parse(localStorage.getItem('pb_plan_usage') || '{}'); } catch(e) {}
  const sorted = [...plans].sort(function(a,b) {
    // First: most recently modified task
    if (a._lastModified || b._lastModified) {
      if (!a._lastModified) return 1;
      if (!b._lastModified) return -1;
      if (b._lastModified !== a._lastModified) return b._lastModified > a._lastModified ? 1 : -1;
    }
    // Then: localStorage usage
    const ua = usage[a.id] || 0;
    const ub = usage[b.id] || 0;
    if (ub !== ua) return ub - ua;
    return b._activeTasks - a._activeTasks;
  });
  const top5 = sorted.slice(0, 5);
  const rest = sorted.slice(5);
  const msgId = 'plan-picker-' + Date.now();
  const botMsg = document.createElement('div');
  botMsg.className = 'msg bot';
  botMsg.id = msgId;
  botMsg._allPlans = sorted;

  function chipHtml(p) {
    return '<div class="plan-chip" onclick="selectPlan(\'' + p.id + '\')">' +
      '<div><div class="plan-chip-name">' + p.title + '</div>' +
      '<div class="plan-chip-meta">' + p._activeTasks + ' active task' + (p._activeTasks !== 1 ? 's' : '') + '</div></div>' +
      '<div class="plan-chip-arrow">→</div></div>';
  }

  const otherBtn = rest.length > 0
    ? '<div class="plan-chip" id="show-more-' + msgId + '" onclick="showMorePlans(\'' + msgId + '\')"  style="justify-content:center;color:var(--web);font-weight:600;font-size:13px;">+ ' + rest.length + ' more plans</div>'
    : '';

  botMsg.innerHTML = '<div class="avatar bot">PB</div><div class="bubble">' +
    'Hi! Which plan would you like to work on?' +
    '<div class="plan-chips" id="chips-' + msgId + '">' +
    top5.map(chipHtml).join('') + otherBtn +
    '</div></div>';

  document.getElementById('chat-messages').appendChild(botMsg);
  document.getElementById('chat-messages').scrollTop = 999999;
}

function showMorePlans(msgId) {
  const msg = document.getElementById(msgId);
  if (!msg) return;
  const sorted = msg._allPlans;
  const chipsEl = document.getElementById('chips-' + msgId);
  if (!chipsEl) return;

  // Replace with search + all plans
  chipsEl.innerHTML =
    '<input type="text" placeholder="Search plans…" ' +
    'style="width:100%;margin:4px 0 8px;padding:7px 10px;border:1px solid var(--border2);border-radius:7px;font-size:12px;font-family:inherit;background:var(--bg);color:var(--text);" ' +
    'oninput="filterPlanChips(\'' + msgId + '\', this.value)" />' +
    '<div id="chips-inner-' + msgId + '">' +
    sorted.map(function(p) {
      return '<div class="plan-chip" onclick="selectPlan(\'' + p.id + '\')">' +
        '<div><div class="plan-chip-name">' + p.title + '</div>' +
        '<div class="plan-chip-meta">' + p._activeTasks + ' active task' + (p._activeTasks !== 1 ? 's' : '') + '</div></div>' +
        '<div class="plan-chip-arrow">→</div></div>';
    }).join('') + '</div>';
  document.getElementById('chat-messages').scrollTop = 999999;
}

function filterPlanChips(msgId, query) {
  const msg = document.getElementById(msgId);
  if (!msg) return;
  const filtered = msg._allPlans.filter(function(p) {
    return p.title.toLowerCase().includes(query.toLowerCase());
  });
  const inner = document.getElementById('chips-inner-' + msgId);
  if (!inner) return;
  inner.innerHTML = filtered.map(function(p) {
    return '<div class="plan-chip" onclick="selectPlan(\'' + p.id + '\')">' +
      '<div><div class="plan-chip-name">' + p.title + '</div>' +
      '<div class="plan-chip-meta">' + p._activeTasks + ' active task' + (p._activeTasks !== 1 ? 's' : '') + '</div></div>' +
      '<div class="plan-chip-arrow">→</div></div>';
  }).join('');
}

async function selectPlan(planId) {
  const plan = plans.find(function(p) { return p.id === planId; });
  if (!plan) return;
  currentPlan = plan;
  document.getElementById('header-plan').textContent = '📋 ' + plan.title;

  // Record usage in localStorage
  try {
    const key = 'pb_plan_usage';
    const usage = JSON.parse(localStorage.getItem(key) || '{}');
    usage[planId] = (usage[planId] || 0) + 1;
    localStorage.setItem(key, JSON.stringify(usage));
  } catch(e) {}

  // Load buckets
  const bd = await callGraph('/planner/plans/' + plan.id + '/buckets');
  currentPlan._buckets = bd.value || [];

  addMsg('user', plan.title);
  addMsg('bot', "Great! I've loaded **" + plan.title + "**. You have **" + plan._activeTasks + "** active tasks. What would you like to do?");

  document.getElementById('plan-bar').style.display = 'flex';
  document.getElementById('plan-bar-name').textContent = plan.title;
  document.getElementById('suggestions').style.display = 'flex';
  renderTasks();
}

function switchPlan() {
  if (!plans.length) return;
  currentPlan = null;
  document.getElementById('header-plan').textContent = '';
  document.getElementById('plan-bar').style.display = 'none';
  document.getElementById('suggestions').style.display = 'none';
  document.getElementById('task-filters').style.display = 'none';
  document.getElementById('task-panel-count').textContent = '';
  document.getElementById('task-panel-title').textContent = 'Tasks';
  document.getElementById('task-list').innerHTML = '<div class="no-plan-state"><strong>No plan selected</strong>Ask PlannerBot which plan you\'d like to work on.</div>';
  askWhichPlan();
}

// ── GRAPH ──
async function callGraph(path, method='GET', body=null, etag=null) {
  const h = { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' };
  if (etag) h['If-Match'] = etag;
  const r = await fetch(GRAPH + path, { method, headers: h, body: body ? JSON.stringify(body) : null });
  if (!r.ok) throw new Error(await r.text());
  if (r.status === 204) return {};
  return r.json();
}
async function getEtag(id) {
  const r = await fetch(`${GRAPH}/planner/tasks/${id}`, { headers: { 'Authorization': 'Bearer ' + accessToken } });
  return r.headers.get('ETag') || '*';
}
async function refreshTasks() {
  if (!currentPlan) return;
  const [bd, td] = await Promise.all([
    callGraph(`/planner/plans/${currentPlan.id}/buckets`),
    callGraph(`/planner/plans/${currentPlan.id}/tasks`)
  ]);
  currentPlan._buckets = bd.value || [];
  currentPlan._tasks = td.value || [];
  currentPlan._activeTasks = currentPlan._tasks.filter(t => t.percentComplete !== 100).length;
  renderTasks();
}

// ── TASK PANEL ──
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}

function renderTasks() {
  if (!currentPlan) return;
  const tasks = currentPlan._tasks || [];
  const buckets = currentPlan._buckets || [];
  const now = new Date();

  document.getElementById('task-filters').style.display = 'flex';
  document.getElementById('task-panel-title').textContent = currentPlan.title;

  let filtered = tasks;
  if (currentFilter === 'active') filtered = tasks.filter(t => t.percentComplete !== 100);
  else if (currentFilter === 'completed') filtered = tasks.filter(t => t.percentComplete === 100);
  else if (currentFilter === 'overdue') filtered = tasks.filter(t => t.dueDateTime && new Date(t.dueDateTime) < now && t.percentComplete !== 100);

  document.getElementById('task-panel-count').textContent = filtered.length + ' task' + (filtered.length !== 1 ? 's' : '');

  const list = document.getElementById('task-list');
  const pmap = {0:'urgent',1:'important',2:'important',3:'medium',4:'medium',5:'medium',6:'low',7:'low',8:'low',9:'low'};
  list.innerHTML = '';

  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state">No tasks match this filter.</div>';
    return;
  }

  // Render one column per bucket (kanban style)
  buckets.forEach(function(bucket) {
    const btasks = filtered.filter(function(t) { return t.bucketId === bucket.id; });
    if (btasks.length === 0) return;

    const col = document.createElement('div');
    col.className = 'bucket-col';
    col.innerHTML = '<div class="bucket-col-header"><span class="bucket-col-name">' + bucket.name + '</span><span class="bucket-col-count">' + btasks.length + '</span></div><div class="bucket-col-tasks" id="col-' + bucket.id + '"></div>';
    list.appendChild(col);

    const colTasks = document.getElementById('col-' + bucket.id);
    btasks.forEach(function(t) {
      const done = t.percentComplete === 100;
      const overdue = t.dueDateTime && new Date(t.dueDateTime) < now && !done;
      const priority = pmap[t.priority] || 'medium';
      const due = t.dueDateTime ? new Date(t.dueDateTime).toLocaleDateString('en-GB', {day:'numeric', month:'short'}) : '';
      const item = document.createElement('div');
      item.className = 'task-item';
      item.innerHTML =
        '<div class="task-check' + (done ? ' done' : '') + '" onclick="quickToggle(\'' + t.id + '\')" ></div>' +
        '<div class="task-info">' +
          '<div class="task-title' + (done ? ' done' : '') + '">' + t.title + '</div>' +
          '<div class="task-tags">' +
            (priority !== 'medium' ? '<span class="task-tag ' + priority + '">' + priority + '</span>' : '') +
            (due ? '<span class="task-tag' + (overdue ? ' overdue' : '') + '">' + (overdue ? '⚠️ ' : '') + due + '</span>' : '') +
          '</div>' +
        '</div>';
      colTasks.appendChild(item);
    });
  });

  // Orphan tasks (no matching bucket)
  const orphans = filtered.filter(function(t) { return !buckets.find(function(b) { return b.id === t.bucketId; }); });
  if (orphans.length) {
    const col = document.createElement('div');
    col.className = 'bucket-col';
    col.innerHTML = '<div class="bucket-col-header"><span class="bucket-col-name">Other</span><span class="bucket-col-count">' + orphans.length + '</span></div><div class="bucket-col-tasks" id="col-other"></div>';
    list.appendChild(col);
    const colTasks = document.getElementById('col-other');
    orphans.forEach(function(t) {
      const done = t.percentComplete === 100;
      const item = document.createElement('div');
      item.className = 'task-item';
      item.innerHTML = '<div class="task-check' + (done ? ' done' : '') + '" onclick="quickToggle(\'' + t.id + '\')" ></div><div class="task-info"><div class="task-title' + (done ? ' done' : '') + '">' + t.title + '</div></div>';
      colTasks.appendChild(item);
    });
  }
}

async function quickToggle(taskId) {
  const task = (currentPlan._tasks||[]).find(t => t.id === taskId);
  if (!task) return;
  const pct = task.percentComplete === 100 ? 0 : 100;
  try {
    const e = await getEtag(taskId);
    await callGraph(`/planner/tasks/${taskId}`, 'PATCH', { percentComplete: pct }, e);
    task.percentComplete = pct;
    renderTasks();
  } catch(e) { console.warn(e); }
}

// ── SHAREPOINT ──
async function fetchSharePointDoc(url) {
  const encoded = btoa(url).replace(/=/g,'').replace(/[+]/g,'-').replace(/[/]/g,'_');
  const shareToken = 'u!' + encoded;

  const shareItem = await callGraph('/shares/' + shareToken + '/driveItem');
  if (!shareItem || !shareItem.id) throw new Error('Could not resolve the shared link.');
  const driveId = shareItem.parentReference && shareItem.parentReference.driveId;
  if (!driveId) throw new Error('Could not determine drive.');

  // Method 1: format=text
  const textResp = await fetch(GRAPH + '/drives/' + driveId + '/items/' + shareItem.id + '/content?format=text', {
    headers: { 'Authorization': 'Bearer ' + accessToken }
  });
  if (textResp.ok) {
    const text = await textResp.text();
    if (text && text.trim().length > 100) {
      return 'File: ' + shareItem.name + '\n\n' + text.slice(0, 15000);
    }
  }

  // Method 2: download docx and unzip
  const dlResp = await fetch(GRAPH + '/drives/' + driveId + '/items/' + shareItem.id + '/content', {
    headers: { 'Authorization': 'Bearer ' + accessToken }
  });
  if (!dlResp.ok) throw new Error('Could not download file.');

  const arrayBuffer = await dlResp.arrayBuffer();
  const bytes = new Uint8Array(arrayBuffer);
  const decoder = new TextDecoder('utf-8', { fatal: false });

  // Find word/document.xml in the ZIP
  async function decompress(data) {
    const ds = new DecompressionStream('deflate-raw');
    const writer = ds.writable.getWriter();
    const reader = ds.readable.getReader();
    writer.write(data);
    writer.close();
    const chunks = [];
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      if (value) chunks.push(value);
    }
    const total = chunks.reduce(function(a, c) { return a + c.length; }, 0);
    const merged = new Uint8Array(total);
    let offset = 0;
    chunks.forEach(function(c) { merged.set(c, offset); offset += c.length; });
    return decoder.decode(merged);
  }

  let i = 0;
  while (i < bytes.length - 30) {
    if (bytes[i] === 0x50 && bytes[i+1] === 0x4B && bytes[i+2] === 0x03 && bytes[i+3] === 0x04) {
      const compression = bytes[i+8] | (bytes[i+9] << 8);
      const compressedSize = bytes[i+18] | (bytes[i+19]<<8) | (bytes[i+20]<<16) | (bytes[i+21]<<24);
      const filenameLen = bytes[i+26] | (bytes[i+27] << 8);
      const extraLen = bytes[i+28] | (bytes[i+29] << 8);
      const filename = decoder.decode(bytes.slice(i+30, i+30+filenameLen));
      const dataStart = i + 30 + filenameLen + extraLen;

      if (filename === 'word/document.xml') {
        const compressedData = bytes.slice(dataStart, dataStart + compressedSize);
        let xml = '';
        if (compression === 0) {
          xml = decoder.decode(compressedData);
        } else {
          xml = await decompress(compressedData);
        }
        const matches = xml.match(/<w:t[^>]*>([^<]*)<\/w:t>/g);
        if (matches && matches.length > 0) {
          const text = matches
            .map(function(m) { return m.replace(/<[^>]+>/g, ''); })
            .filter(function(t) { return t.trim().length > 0; })
            .join(' ')
            .replace(/\s+/g, ' ')
            .trim();
          return 'File: ' + shareItem.name + '\n\n' + text.slice(0, 15000);
        }
      }
      i = dataStart + Math.max(compressedSize, 1);
    } else {
      i++;
    }
  }

  throw new Error('Could not extract text. Please paste the document content directly.');
}

function isSharePointUrl(text) {
  return /https?:\/\/[a-z0-9-]+\.sharepoint\.com\S+/i.test(text);
}
function extractUrl(text) {
  const m = text.match(/https?:\/\/\S+/);
  return m ? m[0] : null;
}

// ── AI ──
function buildSystem() {
  const now = new Date();
  const pmap = {0:'urgent',1:'important',2:'important',3:'medium',4:'medium',5:'medium',6:'low',7:'low',8:'low',9:'low'};
  const tasks = currentPlan?._tasks || [];
  const buckets = currentPlan?._buckets || [];
  const tlist = tasks.map(t => {
    const b = buckets.find(x => x.id === t.bucketId);
    const due = t.dueDateTime ? new Date(t.dueDateTime).toLocaleDateString('en-GB') : 'no due date';
    const st = t.percentComplete===100 ? 'completed' : t.percentComplete>0 ? 'in progress' : 'not started';
    const ov = t.dueDateTime && new Date(t.dueDateTime)<now && t.percentComplete!==100;
    return `ID:${t.id} | "${t.title}" | bucket:${b?.name||'none'} | priority:${pmap[t.priority]||'medium'} | status:${st} | due:${due}${ov?' [OVERDUE]':''}`;
  }).join('\n');

  const planList = plans.map(p => `ID:${p.id} | "${p.title}" | ${p._activeTasks} active tasks`).join('\n');

  return `You are PlannerBot, an AI assistant for Microsoft Planner at Sectra. Help users manage tasks conversationally.

Today: ${now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}.
${currentPlan ? `Current plan: "${currentPlan.title}" | ${tasks.length} tasks.` : 'No plan selected yet.'}

${currentPlan ? `TASKS:\n${tlist||'No tasks.'}\n\nBUCKETS: ${buckets.map(b=>`${b.name} (ID:${b.id})`).join(', ')||'None'}` : ''}

ALL PLANS:\n${planList}

DOCUMENT-TO-TASKS: If the user pastes document text, extract actionable items and create tasks from it.

SWITCH PLAN: If the user wants to switch plans, respond with:
<action>{"type":"SWITCH_PLAN"}</action>

TASK ACTIONS (only when a plan is selected):
<action>{"type":"CREATE","title":"Task title","bucketId":"optional-id","priority":5,"dueDate":"YYYY-MM-DD","notes":"Optional notes text"}</action>
<action>{"type":"COMPLETE","taskId":"id"}</action>
<action>{"type":"INCOMPLETE","taskId":"id"}</action>
<action>{"type":"DELETE","taskId":"id"}</action>
<action>{"type":"EDIT","taskId":"id","title":"New title","priority":0,"dueDate":"YYYY-MM-DD"}</action>

Priority: 0=urgent, 2=important, 5=medium, 9=low. Default bucket: ${buckets[0]?.id||''}.

CONFIRMATION RULES — always follow these:
1. Before executing ANY action (create, edit, complete, delete), first describe what you are about to do and ask the user to confirm. Example: "I'll create a task called 'X' with priority urgent due Friday. Shall I go ahead?"
2. Only include <action> tags AFTER the user has confirmed (said yes, ok, go ahead, sure, etc.)
3. For DELETE, always warn clearly: "This will permanently delete '[task name]'. Are you sure?"
4. For bulk actions (multiple tasks), list all of them and ask once.
5. After executing, confirm what was done. Example: "Done! I've created the task 'X'."
6. If the user's message is clearly a confirmation (yes/ok/sure/go ahead/do it), execute the pending action immediately.

Be concise and professional.`;
}

async function sendMsg() {
  if (busy) return;
  const inp = document.getElementById('chat-input');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = 'auto';

  addMsg('user', text);
  const typing = addTyping();
  busy = true; document.getElementById('send-btn').disabled = true;

  try {
    let content = text;

    // SharePoint doc fetch
    if (isSharePointUrl(text)) {
      const spUrl = extractUrl(text);
      if (spUrl) {
        try {
          const docContent = await fetchSharePointDoc(spUrl);
          const instruction = text.replace(spUrl,'').trim() || 'Analyse this document and create tasks from it';
          content = `${instruction}\n\n--- DOCUMENT ---\n${docContent}\n--- END ---`;
        } catch(e) {
          typing.remove();
          addMsg('bot', `⚠️ Could not read the document: ${e.message}`);
          busy=false; document.getElementById('send-btn').disabled=false;
          return;
        }
      }
    }

    history.push({ role:'user', content });
    const res = await fetch(AZ_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'api-key': AZ_KEY },
      body: JSON.stringify({ messages:[{role:'system',content:buildSystem()},...history], max_tokens:1500, temperature:0.3 })
    });
    if (!res.ok) { const e=await res.json(); throw new Error(e.error?.message||'Azure OpenAI error'); }
    const data = await res.json();
    const reply = data.choices[0].message.content;
    history.push({role:'assistant',content:reply});

    const actions = [...reply.matchAll(/<action>([\s\S]*?)<\/action>/g)];
    const clean = reply.replace(/<action>[\s\S]*?<\/action>/g,'').trim();

    let needsRefresh = false;
    for (const a of actions) {
      try {
        const action = JSON.parse(a[1]);
        if (action.type === 'SWITCH_PLAN') { typing.remove(); switchPlan(); busy=false; document.getElementById('send-btn').disabled=false; return; }
        await doAction(action);
        needsRefresh = true;
      } catch(e) { console.warn(e); }
    }
    if (needsRefresh) await refreshTasks();

    typing.remove();
    addMsg('bot', clean);
  } catch(e) {
    typing.remove();
    addMsg('bot', 'Something went wrong: ' + e.message);
  }
  busy=false; document.getElementById('send-btn').disabled=false;
}

async function doAction(a) {
  if (a.type==='CREATE') {
    const b={planId:currentPlan.id,title:a.title,priority:a.priority??5};
    if (a.bucketId) b.bucketId=a.bucketId;
    if (a.dueDate) b.dueDateTime=new Date(a.dueDate).toISOString();
    const created = await callGraph('/planner/tasks','POST',b);
    if (a.notes && created && created.id) {
      // Wait for task to settle before updating details
      await new Promise(function(r) { setTimeout(r, 800); });
      try {
        const detailR = await fetch(GRAPH + '/planner/tasks/' + created.id + '/details', { headers: { 'Authorization': 'Bearer ' + accessToken } }); const detailEtag = detailR.headers.get('ETag') || '*';
        await callGraph('/planner/tasks/' + created.id + '/details', 'PATCH', { description: a.notes }, detailEtag);
      } catch(e) { console.warn('Notes update failed:', e); }
    }
  } else if (a.type==='COMPLETE'||a.type==='INCOMPLETE') {
    const e=await getEtag(a.taskId);
    await callGraph(`/planner/tasks/${a.taskId}`,'PATCH',{percentComplete:a.type==='COMPLETE'?100:0},e);
  } else if (a.type==='DELETE') {
    const e=await getEtag(a.taskId);
    await callGraph(`/planner/tasks/${a.taskId}`,'DELETE',null,e);
  } else if (a.type==='EDIT') {
    const e=await getEtag(a.taskId);
    const b={};
    if (a.title) b.title=a.title;
    if (a.priority!==undefined) b.priority=a.priority;
    if (a.dueDate) b.dueDateTime=new Date(a.dueDate).toISOString();
    await callGraph(`/planner/tasks/${a.taskId}`,'PATCH',b,e);
  }
}

// ── CHAT UI ──
function addMsg(role, text) {
  const area=document.getElementById('chat-messages');
  const d=document.createElement('div'); d.className=`msg ${role}`;
  const init=role==='bot'?'PB':(document.getElementById('header-user').textContent.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()||'ME');
  const html=role==='bot'
    ?esc(text).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/`(.*?)`/g,'<code>$1</code>').replace(/\n/g,'<br>')
    :esc(text);
  d.innerHTML=`<div class="avatar ${role}">${init}</div><div class="bubble">${html}</div>`;
  area.appendChild(d); area.scrollTop=area.scrollHeight; return d;
}
function addTyping() {
  const area=document.getElementById('chat-messages');
  const d=document.createElement('div'); d.className='msg bot';
  d.innerHTML=`<div class="avatar bot">PB</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  area.appendChild(d); area.scrollTop=area.scrollHeight; return d;
}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function useSug(btn){
  if (btn.textContent==='Switch plan') { switchPlan(); return; }
  document.getElementById('chat-input').value=btn.textContent; sendMsg();
}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px';}
